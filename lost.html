<!DOCTYPE html>
<html>
  <head>
    <title>Escape Room</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="js/game.js"></script>
  </head>
  <body>
    <audio autoplay>
        <source src="audio/womp-womp.mp3">
    </audio>

    <div class="lost" style="display: flex; height: 350px; flex-direction: column; justify-content: center; align-items: center;">
        <h1 class="fadeInUp-animation" style="margin: 0; font-size: 50px; font-family: sans-serif">Uh Oh!</h1>
        <p class="fadeInUp-animation" style="margin: 0; size: 30px; font-family: sans-serif">
            You didn't escape in time...
        </p>
        <a href="index.html">
            <button class="fadeInUp-animation" style="font-family: sans-serif; font-weight: 700; background: #c5a059; border-radius: 24px; padding: 12px 45px; font-size: 18px;">Try again</button>
        </a>
    </div>
  </body>
</html>
