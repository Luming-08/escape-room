<!DOCTYPE html>
<html>
  <head>
    <title>Escape Room</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="js/game.js"></script>
  </head>
  <body>
    <audio autoplay>
        <source src="audio/yippee.mp3">
    </audio>

    <div class="escaped" style="display: flex; height: 350px; flex-direction: column; justify-content: center; align-items: center;">
        <h1 class="fadeInUp-animation" style="margin: 0; font-size: 50px; font-family: sans-serif"><b>Congrats!</b></h1>
        <p class="fadeInUp-animation" style="margin: 0; font-size: 30px; font-family: sans-serif">
            You escaped with <span id="timeLeftDisplay"></span> remaining!
        </p>
        <a href="index.html">
            <button class="fadeInUp-animation" style="font-family: sans-serif; font-weight: 700; background: #c5a059; border-radius: 24px; padding: 12px 45px; font-size: 18px;">Play again</button>
        </a>
    </div>
    
    <script>
        const timeLeft = Number(localStorage.getItem("timeLeft"));

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        document.getElementById("timeLeftDisplay").innerText =
            `${minutes}:${seconds.toString().padStart(2, "0")}`;
    </script>
  </body>
</html>
